name: 🔒 Security Scanning & Monitoring

on:
  push:
    branches: [ main, develop, security/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - dependencies-only
          - secrets-only
          - containers-only

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.4'

jobs:
  # Job 1: Dependency Security Audit
  dependency-security:
    name: 📦 Dependency Security Audit
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type != 'secrets-only' && github.event.inputs.scan_type != 'containers-only'
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: 📦 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: 🗄️ Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🔍 Run dependency audit
        run: |
          echo "::group::Dependency Vulnerability Scan"
          pnpm audit --audit-level=moderate --json > dependency-audit.json || true
          echo "::endgroup::"
          
      - name: 📊 Parse audit results
        id: audit-results
        run: |
          if command -v jq &> /dev/null; then
            CRITICAL=$(jq -r '.vulnerabilities | to_entries | map(select(.value.severity == "critical")) | length' dependency-audit.json 2>/dev/null || echo "0")
            HIGH=$(jq -r '.vulnerabilities | to_entries | map(select(.value.severity == "high")) | length' dependency-audit.json 2>/dev/null || echo "0")
            MODERATE=$(jq -r '.vulnerabilities | to_entries | map(select(.value.severity == "moderate")) | length' dependency-audit.json 2>/dev/null || echo "0")
            
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
            
            echo "### 📦 Dependency Security Report" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: 🚨 Fail on critical vulnerabilities
        if: steps.audit-results.outputs.critical > 0 || steps.audit-results.outputs.high > 0
        run: |
          echo "::error::Critical or high severity vulnerabilities found!"
          echo "Critical: ${{ steps.audit-results.outputs.critical }}"
          echo "High: ${{ steps.audit-results.outputs.high }}"
          exit 1
          
      - name: 📤 Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: dependency-audit.json
          retention-days: 30

  # Job 2: Secret Scanning  
  secret-scanning:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type != 'dependencies-only' && github.event.inputs.scan_type != 'containers-only'
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔐 Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
          
      - name: 🔍 Custom Secret Pattern Scan
        run: |
          echo "::group::Custom Secret Pattern Scan"
          
          # Define secret patterns
          declare -a patterns=(
            "password.*=.*['\"][^'\"]{8,}['\"]"
            "api[_-]?key.*=.*['\"][^'\"]{16,}['\"]"
            "secret.*=.*['\"][^'\"]{16,}['\"]"
            "token.*=.*['\"][^'\"]{16,}['\"]"
            "private[_-]?key.*=.*['\"][^'\"]{32,}['\"]"
            "aws[_-]?access.*=.*['\"][^'\"]{16,}['\"]"
            "-----BEGIN.*PRIVATE KEY-----"
          )
          
          SECRET_FOUND=false
          
          for pattern in "${patterns[@]}"; do
            echo "Checking pattern: $pattern"
            if grep -r -E "$pattern" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=secrets \
              --exclude="*.log" \
              --exclude="*.backup" \
              --exclude="security-scan.yml" \
              --exclude="SECURITY_REMEDIATION_PLAN.md" \
              2>/dev/null | grep -v ".env.example" | grep -v "fix-critical-security.sh"; then
              echo "::error::Potential secret found matching pattern: $pattern"
              SECRET_FOUND=true
            fi
          done
          
          if [ "$SECRET_FOUND" = true ]; then
            echo "::error::Secrets detected in codebase!"
            exit 1
          else
            echo "✅ No secrets detected"
          fi
          
          echo "::endgroup::"

  # Job 3: Container Security Audit
  container-security:
    name: 🐳 Container Security Audit
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type != 'dependencies-only' && github.event.inputs.scan_type != 'secrets-only'
    
    strategy:
      matrix:
        container: [edge-api, nginx-proxy, meilisearch, redis]
        
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 🔨 Build container image
        run: |
          case "${{ matrix.container }}" in
            "edge-api")
              docker build -t grahmos-${{ matrix.container }}:test ./apps/edge-api/
              ;;
            "nginx-proxy")
              # Use base nginx image for scanning
              docker pull nginx:1.25-alpine
              docker tag nginx:1.25-alpine grahmos-${{ matrix.container }}:test
              ;;
            "meilisearch")
              docker pull getmeili/meilisearch:v1.5.1
              docker tag getmeili/meilisearch:v1.5.1 grahmos-${{ matrix.container }}:test
              ;;
            "redis")
              docker pull redis:7-alpine
              docker tag redis:7-alpine grahmos-${{ matrix.container }}:test
              ;;
          esac
          
      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'grahmos-${{ matrix.container }}:test'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.container }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: 📊 Run Trivy for JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'grahmos-${{ matrix.container }}:test'
          format: 'json'
          output: 'trivy-results-${{ matrix.container }}.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: 📊 Parse Trivy results
        run: |
          if [ -f "trivy-results-${{ matrix.container }}.json" ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results-${{ matrix.container }}.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results-${{ matrix.container }}.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results-${{ matrix.container }}.json 2>/dev/null || echo "0")
            
            echo "### 🐳 Container Security Report - ${{ matrix.container }}" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            
            # Fail on critical vulnerabilities
            if [ "$CRITICAL" -gt "0" ]; then
              echo "::error::Critical vulnerabilities found in ${{ matrix.container }} container"
              exit 1
            fi
          fi
          
      - name: 📤 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.container }}.sarif'
          
      - name: 📤 Upload container scan results
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-${{ matrix.container }}
          path: |
            trivy-results-${{ matrix.container }}.json
            trivy-results-${{ matrix.container }}.sarif
          retention-days: 30

  # Job 4: Infrastructure Security Audit
  infrastructure-security:
    name: 🏗️ Infrastructure Security Audit
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == ''
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔍 Scan Docker Compose configurations
        run: |
          echo "::group::Docker Compose Security Scan"
          
          ISSUES_FOUND=false
          
          # Check for hardcoded secrets
          if grep -r -E "(password|secret|key).*:.*['\"][^'\"]{8,}['\"]" docker-compose*.yml 2>/dev/null; then
            echo "::error::Hardcoded secrets found in Docker Compose files"
            ISSUES_FOUND=true
          fi
          
          # Check for privileged containers
          if grep -r "privileged.*true" docker-compose*.yml 2>/dev/null; then
            echo "::error::Privileged containers found"
            ISSUES_FOUND=true
          fi
          
          # Check for host network mode
          if grep -r "network_mode.*host" docker-compose*.yml 2>/dev/null; then
            echo "::warning::Host network mode detected"
          fi
          
          # Check for volume mounts to sensitive paths
          if grep -r -E "volumes:.*/(etc|root|proc|sys):" docker-compose*.yml 2>/dev/null; then
            echo "::warning::Sensitive path mounts detected"
          fi
          
          if [ "$ISSUES_FOUND" = true ]; then
            echo "::error::Infrastructure security issues found"
            exit 1
          else
            echo "✅ No critical infrastructure issues found"
          fi
          
          echo "::endgroup::"
          
      - name: 🔍 Scan Kubernetes configurations
        run: |
          echo "::group::Kubernetes Security Scan"
          
          if find . -name "*.yaml" -o -name "*.yml" | xargs grep -l "apiVersion.*v1" 2>/dev/null; then
            echo "Kubernetes configurations found, scanning..."
            
            # Check for privileged pods
            if find . -name "*.yaml" -o -name "*.yml" | xargs grep -l "privileged.*true" 2>/dev/null; then
              echo "::error::Privileged pods detected"
              exit 1
            fi
            
            # Check for containers running as root
            if find . -name "*.yaml" -o -name "*.yml" | xargs grep -l "runAsUser.*0" 2>/dev/null; then
              echo "::error::Containers running as root detected"
              exit 1
            fi
            
            echo "✅ Kubernetes configurations look secure"
          else
            echo "No Kubernetes configurations found"
          fi
          
          echo "::endgroup::"

  # Job 5: Dynamic Application Security Testing (DAST)
  dast:
    name: 🎯 Dynamic Application Security Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == ''
    
    services:
      # Start the application for testing
      test-app:
        image: node:20-alpine
        options: --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1" --health-interval 30s --health-timeout 10s --health-retries 3
        
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐳 Start test environment
        run: |
          echo "::group::Starting Test Environment"
          # Start a minimal version of the app for security testing
          docker-compose -f docker-compose.yml up -d --wait
          sleep 30
          echo "::endgroup::"
          
      - name: 🎯 Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      - name: 🛑 Stop test environment
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v

  # Job 6: Security Compliance Verification
  compliance:
    name: ✅ Security Compliance Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == ''
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        
      - name: ✅ Run compliance checks
        run: |
          echo "::group::Security Compliance Verification"
          
          COMPLIANCE_ISSUES=0
          
          # Check for security documentation
          if [ ! -f "SECURITY_REMEDIATION_PLAN.md" ]; then
            echo "::error::Security remediation plan missing"
            ((COMPLIANCE_ISSUES++))
          fi
          
          # Check for .gitignore security entries
          if ! grep -q "secrets/" .gitignore 2>/dev/null; then
            echo "::error::.gitignore missing secrets/ exclusion"
            ((COMPLIANCE_ISSUES++))
          fi
          
          if ! grep -q ".env.production" .gitignore 2>/dev/null; then
            echo "::error::.gitignore missing .env.production exclusion"
            ((COMPLIANCE_ISSUES++))
          fi
          
          # Check for security scripts
          if [ ! -f "scripts/fix-critical-security.sh" ]; then
            echo "::error::Security fix script missing"
            ((COMPLIANCE_ISSUES++))
          fi
          
          if [ ! -f "scripts/security-scan-automated.sh" ]; then
            echo "::error::Automated security scan script missing"
            ((COMPLIANCE_ISSUES++))
          fi
          
          # Check for security configurations
          if [ ! -f "infra/security/security-policies.yml" ]; then
            echo "::warning::Security policies configuration missing"
          fi
          
          echo "Compliance issues found: $COMPLIANCE_ISSUES"
          
          if [ $COMPLIANCE_ISSUES -gt 0 ]; then
            echo "::error::Security compliance verification failed"
            exit 1
          else
            echo "✅ Security compliance verification passed"
          fi
          
          echo "::endgroup::"

  # Job 7: Security Report Generation
  security-report:
    name: 📊 Security Report Generation
    runs-on: ubuntu-latest
    if: always()
    needs: [dependency-security, secret-scanning, container-security, infrastructure-security, dast, compliance]
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts
          
      - name: 📊 Generate comprehensive security report
        run: |
          mkdir -p security-reports
          
          cat > security-reports/security-summary.md << EOF
          # 🔒 Security Scan Summary Report
          
          **Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Repository**: ${{ github.repository }}
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          **Triggered by**: ${{ github.event_name }}
          
          ## 📊 Job Results
          
          | Job | Status |
          |-----|--------|
          | Dependency Security | ${{ needs.dependency-security.result }} |
          | Secret Scanning | ${{ needs.secret-scanning.result }} |
          | Container Security | ${{ needs.container-security.result }} |
          | Infrastructure Security | ${{ needs.infrastructure-security.result }} |
          | DAST | ${{ needs.dast.result }} |
          | Compliance | ${{ needs.compliance.result }} |
          
          ## 🎯 Overall Status
          
          EOF
          
          # Determine overall status
          if [[ "${{ needs.dependency-security.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scanning.result }}" == "failure" ]] || \
             [[ "${{ needs.container-security.result }}" == "failure" ]] || \
             [[ "${{ needs.infrastructure-security.result }}" == "failure" ]] || \
             [[ "${{ needs.dast.result }}" == "failure" ]] || \
             [[ "${{ needs.compliance.result }}" == "failure" ]]; then
            echo "🚨 **SECURITY SCAN FAILED** - Deployment should be blocked" >> security-reports/security-summary.md
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "✅ **SECURITY SCAN PASSED** - Deployment can proceed" >> security-reports/security-summary.md
            echo "status=passed" >> $GITHUB_OUTPUT
          fi
          
          cat >> security-reports/security-summary.md << EOF
          
          ## 🔧 Next Steps
          
          1. Review detailed scan results in the job logs
          2. Download security artifacts for detailed analysis
          3. Run \`./scripts/fix-critical-security.sh\` for automated fixes
          4. Address any remaining issues manually
          5. Re-run security scan to verify fixes
          
          ## 📞 Support
          
          For security issues, contact: security@grahmos.com
          
          ---
          *Generated by Grahmos Security Pipeline*
          EOF
          
      - name: 📤 Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-reports/
          retention-days: 90
          
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-reports/security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # Job 8: Security Notification
  notify:
    name: 🚨 Security Notification
    runs-on: ubuntu-latest
    if: always() && (needs.dependency-security.result == 'failure' || needs.secret-scanning.result == 'failure' || needs.container-security.result == 'failure')
    needs: [dependency-security, secret-scanning, container-security, infrastructure-security, dast, compliance]
    
    steps:
      - name: 🚨 Send security alert
        run: |
          echo "::error::SECURITY ALERT: Critical security issues detected!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Failed jobs:"
          [[ "${{ needs.dependency-security.result }}" == "failure" ]] && echo "- Dependency Security"
          [[ "${{ needs.secret-scanning.result }}" == "failure" ]] && echo "- Secret Scanning"
          [[ "${{ needs.container-security.result }}" == "failure" ]] && echo "- Container Security"
          [[ "${{ needs.infrastructure-security.result }}" == "failure" ]] && echo "- Infrastructure Security"
          [[ "${{ needs.dast.result }}" == "failure" ]] && echo "- DAST"
          [[ "${{ needs.compliance.result }}" == "failure" ]] && echo "- Compliance"
          echo ""
          echo "IMMEDIATE ACTION REQUIRED!"